[project]
name = "noisefloor"
version = "0.0.1"
description = "Catch silent numeric regressions in vLLM before they ship"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
