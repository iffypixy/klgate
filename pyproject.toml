[project]
name = "driftgate"
version = "0.0.1"
description = "A benchmark of real inference-engine regressions, and a fair comparison of the checks that catch them"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
